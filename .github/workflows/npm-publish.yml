name: Update and Publish Package

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  update-and-publish:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Check out the repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Update the package version
      - name: Update package.json version
        id: update_version
        run: |
          npm version patch --no-git-tag-version
          echo "::set-output name=NEW_VERSION::$(node -p \"require('./package.json').version\")"

      # Step 5: Commit and push the updated package.json
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "ci: bump package version to ${{ steps.update_version.outputs.NEW_VERSION }} [skip ci]"
          git push

      # Step 6: Publish the package to npm
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
        run: npm publish
